<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300">
  <style>
    .corner { animation: cornerPulse 12s ease-in-out infinite; }
    .frame { animation: framePulse 12s ease-in-out infinite; }
    .status-dot { animation: statusPulse 12s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .scan { animation: scanDrift 12s linear infinite; }
    .glitch-r { animation: glitchR 12s ease-out infinite; }
    .glitch-c { animation: glitchC 12s ease-out infinite; }

    @keyframes cornerPulse {
      0%, 100% { opacity: 0.85; }
      50% { opacity: 1; }
    }
    @keyframes framePulse {
      0%, 100% { stroke-opacity: 0.35; }
      50% { stroke-opacity: 0.6; }
    }
    @keyframes statusPulse {
      0%, 70%, 100% { opacity: 1; transform: scale(1); }
      80% { opacity: 0.4; transform: scale(0.7); }
    }
    @keyframes scanDrift {
      from { transform: translateY(0); }
      to { transform: translateY(8px); }
    }
    @keyframes glitchR {
      0%, 4%, 8%, 92%, 96%, 100% { opacity: 0; transform: translate(0, 0); }
      6%, 94% { opacity: 0.7; transform: translate(-3px, 1px); }
    }
    @keyframes glitchC {
      0%, 4%, 8%, 92%, 96%, 100% { opacity: 0; transform: translate(0, 0); }
      6%, 94% { opacity: 0.7; transform: translate(3px, -1px); }
    }
  </style>
  <defs>
    <linearGradient id="neon-about-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0118"/>
      <stop offset="100%" stop-color="#ff2bd6" stop-opacity="0.1"/>
    </linearGradient>
    <pattern id="scan-about" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#ffffff" fill-opacity="0.025"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="url(#neon-about-bg)" rx="14" ry="14"/>

  <!-- Holographic frame: dashed neon border with corner brackets layered on top -->
  <g class="frame">
    <rect x="48" y="28" width="704" height="250" rx="6" fill="none" stroke="#ff2bd6" stroke-width="1" stroke-opacity="0.45" stroke-dasharray="4 6"/>
  </g>
  <g class="corner">
    <g transform="translate(48 28) scale(1 1)">
    <rect x="0" y="0" width="14" height="2" fill="#ff2bd6" filter="drop-shadow(0 0 4px #ff2bd6)"/>
    <rect x="0" y="0" width="2" height="14" fill="#ff2bd6" filter="drop-shadow(0 0 4px #ff2bd6)"/>
  </g>
  <g transform="translate(752 28) scale(-1 1)">
    <rect x="0" y="0" width="14" height="2" fill="#ff2bd6" filter="drop-shadow(0 0 4px #ff2bd6)"/>
    <rect x="0" y="0" width="2" height="14" fill="#ff2bd6" filter="drop-shadow(0 0 4px #ff2bd6)"/>
  </g>
  <g transform="translate(48 278) scale(1 -1)">
    <rect x="0" y="0" width="14" height="2" fill="#ff2bd6" filter="drop-shadow(0 0 4px #ff2bd6)"/>
    <rect x="0" y="0" width="2" height="14" fill="#ff2bd6" filter="drop-shadow(0 0 4px #ff2bd6)"/>
  </g>
  <g transform="translate(752 278) scale(-1 -1)">
    <rect x="0" y="0" width="14" height="2" fill="#ff2bd6" filter="drop-shadow(0 0 4px #ff2bd6)"/>
    <rect x="0" y="0" width="2" height="14" fill="#ff2bd6" filter="drop-shadow(0 0 4px #ff2bd6)"/>
  </g>
  </g>

  <!-- Title in upper-left of frame -->
  <text class="title" x="62" y="50" fill="#00ddff" font-family="ui-monospace, monospace" font-size="11" letter-spacing="2.5">// USER.PROFILE</text>
  <!-- Frame index/timestamp callout in upper-right (static) -->
  <text x="738" y="50" text-anchor="end" fill="#00ddff" fill-opacity="0.6" font-family="ui-monospace, monospace" font-size="10" letter-spacing="1.5">[ FRAME // 00:1A ]</text>

  <!-- Bio (3 lines max, glitchy chromatic ghosts) -->
  <g class="bio0">
      <text class="glitch-r" x="400" y="104" text-anchor="middle" fill="#ff0080" font-family='"Inter", system-ui, sans-serif' font-size="20" font-weight="500" opacity="0" style="mix-blend-mode:screen">Computer Science and Engineering undergraduate with a strong</text>
      <text class="glitch-c" x="400" y="104" text-anchor="middle" fill="#00ffff" font-family='"Inter", system-ui, sans-serif' font-size="20" font-weight="500" opacity="0" style="mix-blend-mode:screen">Computer Science and Engineering undergraduate with a strong</text>
      <text x="400" y="104" text-anchor="middle" fill="#ffffff" font-family='"Inter", system-ui, sans-serif' font-size="20" font-weight="500">Computer Science and Engineering undergraduate with a strong</text>
    </g>
  <g class="bio1">
      <text class="glitch-r" x="400" y="132" text-anchor="middle" fill="#ff0080" font-family='"Inter", system-ui, sans-serif' font-size="20" font-weight="500" opacity="0" style="mix-blend-mode:screen">foundation in Java, C, C++, Python, databases, and web</text>
      <text class="glitch-c" x="400" y="132" text-anchor="middle" fill="#00ffff" font-family='"Inter", system-ui, sans-serif' font-size="20" font-weight="500" opacity="0" style="mix-blend-mode:screen">foundation in Java, C, C++, Python, databases, and web</text>
      <text x="400" y="132" text-anchor="middle" fill="#ffffff" font-family='"Inter", system-ui, sans-serif' font-size="20" font-weight="500">foundation in Java, C, C++, Python, databases, and web</text>
    </g>
  <g class="bio2">
      <text class="glitch-r" x="400" y="160" text-anchor="middle" fill="#ff0080" font-family='"Inter", system-ui, sans-serif' font-size="20" font-weight="500" opacity="0" style="mix-blend-mode:screen">technologies. Seeking an internship or entry-level software…</text>
      <text class="glitch-c" x="400" y="160" text-anchor="middle" fill="#00ffff" font-family='"Inter", system-ui, sans-serif' font-size="20" font-weight="500" opacity="0" style="mix-blend-mode:screen">technologies. Seeking an internship or entry-level software…</text>
      <text x="400" y="160" text-anchor="middle" fill="#ffffff" font-family='"Inter", system-ui, sans-serif' font-size="20" font-weight="500">technologies. Seeking an internship or entry-level software…</text>
    </g>

  <!-- Skill pills, neon-outlined, alternating cyan/magenta -->
  <g class="pill0">
      <rect x="139" y="196" width="168" height="26" rx="13" fill="#0a0118" fill-opacity="0.6" stroke="#00ddff" stroke-width="1" filter="drop-shadow(0 0 4px #00ddff)"/>
      <text x="223" y="213" text-anchor="middle" fill="#00ddff" font-family="ui-monospace, monospace" font-size="12" letter-spacing="1">FULL STACK DEVELOPER</text>
    </g>
  <g class="pill1">
      <rect x="317" y="196" width="180" height="26" rx="13" fill="#0a0118" fill-opacity="0.6" stroke="#ff2bd6" stroke-width="1" filter="drop-shadow(0 0 4px #ff2bd6)"/>
      <text x="407" y="213" text-anchor="middle" fill="#ff2bd6" font-family="ui-monospace, monospace" font-size="10" letter-spacing="1">MEPCO SCHLENK ENGINEERING…</text>
    </g>
  <g class="pill2">
      <rect x="507" y="196" width="153.6" height="26" rx="13" fill="#0a0118" fill-opacity="0.6" stroke="#00ddff" stroke-width="1" filter="drop-shadow(0 0 4px #00ddff)"/>
      <text x="583.8" y="213" text-anchor="middle" fill="#00ddff" font-family="ui-monospace, monospace" font-size="12" letter-spacing="1">SIVAKASI,TAMILNADU</text>
    </g>

  <!-- Status indicator (bottom right of frame) -->
  <g transform="translate(738 262)">
    <text x="-12" y="3" text-anchor="end" fill="#00ddff" font-family="ui-monospace, monospace" font-size="10" letter-spacing="1.5">STATUS: ENGAGED</text>
    <circle class="status-dot" cx="-4" cy="0" r="3" fill="#ff2bd6" filter="drop-shadow(0 0 5px #ff2bd6)"/>
  </g>

  <!-- Scanlines overlay -->
  <g class="scan">
    <rect width="800" height="308" fill="url(#scan-about)" pointer-events="none"/>
  </g>
</svg>