<svg xmlns="http://www.w3.org/2000/svg" width="800" height="320" viewBox="0 0 800 320">
  <style>
    .corner { animation: cornerPulse 12s ease-in-out infinite; }
    .frame { animation: framePulse 12s ease-in-out infinite; }
    .status-dot { animation: statusPulse 12s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .scan { animation: scanDrift 12s linear infinite; }
    .tile { animation: tileFlicker 12s ease-in-out infinite; }
    .t0 { animation-delay: 0s }
    .t1 { animation-delay: 0.1s }
    .t2 { animation-delay: 0.2s }
    .t3 { animation-delay: 0.30000000000000004s }

    @keyframes cornerPulse {
      0%, 100% { opacity: 0.85; }
      50% { opacity: 1; }
    }
    @keyframes framePulse {
      0%, 100% { stroke-opacity: 0.35; }
      50% { stroke-opacity: 0.6; }
    }
    @keyframes statusPulse {
      0%, 70%, 100% { opacity: 1; transform: scale(1); }
      80% { opacity: 0.4; transform: scale(0.7); }
    }
    @keyframes scanDrift {
      from { transform: translateY(0); }
      to { transform: translateY(8px); }
    }
    @keyframes tileFlicker {
      0%, 90%, 100% { opacity: 1; }
      94% { opacity: 0.6; }
    }
  </style>
  <defs>
    <linearGradient id="neon-stats-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0118"/>
      <stop offset="100%" stop-color="#ff2bd6" stop-opacity="0.1"/>
    </linearGradient>
    <pattern id="scan-stats" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#ffffff" fill-opacity="0.025"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="url(#neon-stats-bg)" rx="14" ry="14"/>

  <!-- Holographic frame: dashed neon border with corner brackets layered on top -->
  <g class="frame">
    <rect x="48" y="28" width="704" height="270" rx="6" fill="none" stroke="#ff2bd6" stroke-width="1" stroke-opacity="0.45" stroke-dasharray="4 6"/>
  </g>
  <g class="corner">
    <g transform="translate(48 28) scale(1 1)">
    <rect x="0" y="0" width="14" height="2" fill="#ff2bd6" filter="drop-shadow(0 0 4px #ff2bd6)"/>
    <rect x="0" y="0" width="2" height="14" fill="#ff2bd6" filter="drop-shadow(0 0 4px #ff2bd6)"/>
  </g>
  <g transform="translate(752 28) scale(-1 1)">
    <rect x="0" y="0" width="14" height="2" fill="#ff2bd6" filter="drop-shadow(0 0 4px #ff2bd6)"/>
    <rect x="0" y="0" width="2" height="14" fill="#ff2bd6" filter="drop-shadow(0 0 4px #ff2bd6)"/>
  </g>
  <g transform="translate(48 298) scale(1 -1)">
    <rect x="0" y="0" width="14" height="2" fill="#ff2bd6" filter="drop-shadow(0 0 4px #ff2bd6)"/>
    <rect x="0" y="0" width="2" height="14" fill="#ff2bd6" filter="drop-shadow(0 0 4px #ff2bd6)"/>
  </g>
  <g transform="translate(752 298) scale(-1 -1)">
    <rect x="0" y="0" width="14" height="2" fill="#ff2bd6" filter="drop-shadow(0 0 4px #ff2bd6)"/>
    <rect x="0" y="0" width="2" height="14" fill="#ff2bd6" filter="drop-shadow(0 0 4px #ff2bd6)"/>
  </g>
  </g>

  <!-- Title (upper-left) and frame index (upper-right) -->
  <text x="62" y="50" fill="#00ddff" font-family="ui-monospace, monospace" font-size="11" letter-spacing="2.5">// GITHUB.STATS</text>
  <text x="738" y="50" text-anchor="end" fill="#00ddff" fill-opacity="0.6" font-family="ui-monospace, monospace" font-size="10" letter-spacing="1.5">[ FRAME // 04:7C ]</text>

  <!-- Stat tiles -->
  <g class="tile t0">
      <rect x="66" y="84" width="156.5" height="96" rx="8" fill="#0a0118" fill-opacity="0.5" stroke="#ff2bd6" stroke-width="1" filter="drop-shadow(0 0 6px #ff2bd6)"/>
      <text x="80" y="106" fill="#ff2bd6" font-family="ui-monospace, monospace" font-size="10" letter-spacing="2">REPOS</text>
      <text x="80" y="148" fill="#ffffff" font-family='"Inter", system-ui, sans-serif' font-size="32" font-weight="700" letter-spacing="-0.5">—</text>
      <text x="80" y="168" fill="#00ddff" font-family="ui-monospace, monospace" font-size="9" letter-spacing="1.2">LOAD GITHUB</text>
    </g>
  <g class="tile t1">
      <rect x="236.5" y="84" width="156.5" height="96" rx="8" fill="#0a0118" fill-opacity="0.5" stroke="#00ddff" stroke-width="1" filter="drop-shadow(0 0 6px #00ddff)"/>
      <text x="250.5" y="106" fill="#00ddff" font-family="ui-monospace, monospace" font-size="10" letter-spacing="2">COMMITS</text>
      <text x="250.5" y="148" fill="#ffffff" font-family='"Inter", system-ui, sans-serif' font-size="32" font-weight="700" letter-spacing="-0.5">—</text>
      <text x="250.5" y="168" fill="#00ddff" font-family="ui-monospace, monospace" font-size="9" letter-spacing="1.2">THIS YEAR</text>
    </g>
  <g class="tile t2">
      <rect x="407" y="84" width="156.5" height="96" rx="8" fill="#0a0118" fill-opacity="0.5" stroke="#ff2bd6" stroke-width="1" filter="drop-shadow(0 0 6px #ff2bd6)"/>
      <text x="421" y="106" fill="#ff2bd6" font-family="ui-monospace, monospace" font-size="10" letter-spacing="2">PRS</text>
      <text x="421" y="148" fill="#ffffff" font-family='"Inter", system-ui, sans-serif' font-size="32" font-weight="700" letter-spacing="-0.5">—</text>
      <text x="421" y="168" fill="#00ddff" font-family="ui-monospace, monospace" font-size="9" letter-spacing="1.2">AUTHORED</text>
    </g>
  <g class="tile t3">
      <rect x="577.5" y="84" width="156.5" height="96" rx="8" fill="#0a0118" fill-opacity="0.5" stroke="#00ddff" stroke-width="1" filter="drop-shadow(0 0 6px #00ddff)"/>
      <text x="591.5" y="106" fill="#00ddff" font-family="ui-monospace, monospace" font-size="10" letter-spacing="2">REVIEWS</text>
      <text x="591.5" y="148" fill="#ffffff" font-family='"Inter", system-ui, sans-serif' font-size="32" font-weight="700" letter-spacing="-0.5">—</text>
      <text x="591.5" y="168" fill="#00ddff" font-family="ui-monospace, monospace" font-size="9" letter-spacing="1.2">THIS YEAR</text>
    </g>

  <!-- Language chips -->
  <g class="chip c0">
      <rect x="342" y="196" width="115.19999999999999" height="28" rx="14" fill="#0a0118" fill-opacity="0.6" stroke="#00ddff" stroke-width="1" filter="drop-shadow(0 0 4px #00ddff)"/>
      <text x="399.6" y="214" text-anchor="middle" fill="#00ddff" font-family="ui-monospace, monospace" font-size="12" letter-spacing="1.5">LOAD GITHUB</text>
    </g>

  <!-- Bottom strip: handle on left, status dot on right -->
  <text x="62" y="282" fill="#00ddff" font-family="ui-monospace, monospace" font-size="10" letter-spacing="1.5">@GITHUB-USER  ·  — CONTRIBS</text>
  <g transform="translate(738 282)">
    <text x="-12" y="3" text-anchor="end" fill="#00ddff" font-family="ui-monospace, monospace" font-size="10" letter-spacing="1.5">STATUS: ENGAGED</text>
    <circle class="status-dot" cx="-4" cy="0" r="3" fill="#ff2bd6" filter="drop-shadow(0 0 5px #ff2bd6)"/>
  </g>

  <!-- Scanlines overlay -->
  <g class="scan">
    <rect width="800" height="328" fill="url(#scan-stats)" pointer-events="none"/>
  </g>
</svg>